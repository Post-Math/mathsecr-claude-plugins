# 이 저장소는 배포 전용입니다. 변경은 발행 봇이 여는 sync/release PR 로만 들어옵니다.
# - provenance: 이 저장소의 sync/release 브랜치에서 발행 봇이 연 PR 이 아니면 실패 (main 필수 체크)
# - secret-scan: PR 내용에 비밀값이 없는지 gitleaks 로 검사 (main 필수 체크)
# - close-foreign: 그 밖의 PR(포크·사람이 연 PR)은 코드를 실행하지 않고 안내 후 닫음
# 공개 저장소이므로 GitHub 호스티드 러너만 사용합니다.
name: Guard

on:
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

env:
  PUBLISHER_LOGIN: postmath-plugin-publisher[bot]
  SYNC_BRANCH: sync/release

jobs:
  provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only the publisher's sync PR may merge
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          ok=1
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || { echo "::error::포크에서 온 PR 은 받지 않습니다"; ok=0; }
          [ "$HEAD_REF" = "$SYNC_BRANCH" ] || { echo "::error::head 브랜치는 $SYNC_BRANCH 여야 합니다"; ok=0; }
          [ "$AUTHOR" = "$PUBLISHER_LOGIN" ] || { echo "::error::PR 작성자는 $PUBLISHER_LOGIN 여야 합니다"; ok=0; }
          [ "$ok" = 1 ]

  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: gitleaks (pinned, checksum-verified)
        env:
          GL_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          rm -rf .git
          dir="$RUNNER_TEMP/gitleaks"; mkdir -p "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          tgz="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$tgz" "$base/$tgz"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${GL_VERSION}_checksums.txt"
          (cd "$dir" && grep " ${tgz}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$tgz" -C "$dir" gitleaks
          "$dir/gitleaks" dir . --redact --no-banner --exit-code 1

  close-foreign:
    if: >-
      github.event_name == 'pull_request_target' && (
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.ref != 'sync/release' ||
        github.event.pull_request.user.login != 'postmath-plugin-publisher[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # PR 코드를 체크아웃하지 않는다 (pull_request_target 은 쓰기 토큰을 가지므로).
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          body='이 저장소는 배포 전용이라 PR 을 직접 받지 않습니다. 플러그인 문의는 수학비서 고객센터로 부탁드립니다. (This repository is distribution-only and does not accept pull requests.)'
          curl -fsS "${auth[@]}" -X POST "$api/issues/${PR}/comments" -d "$(jq -n --arg b "$body" '{body: $b}')" >/dev/null
          curl -fsS "${auth[@]}" -X PATCH "$api/pulls/${PR}" -d '{"state":"closed"}' >/dev/null
